name: frontend
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.1
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  file_picker: ^9.0.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/image.png
    - images/image.png
    - images/logo.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/image.png"
